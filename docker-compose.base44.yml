services:
  mongodb:
    image: mongo:8.0.20
    restart: always
    volumes:
      - mongo_data:/data/db
    command: mongod --noauth
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.35.1
    restart: always
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=DrhYf7zENyR6AlUCKmnz0eYASOQdl6zxH7s7MKFSfFCt
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  setup:
    image: node:24.16.0-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - client_node_modules:/app/client/node_modules
      - api_node_modules:/app/api/node_modules
      - dp_node_modules:/app/packages/data-provider/node_modules
      - ds_node_modules:/app/packages/data-schemas/node_modules
      - pa_node_modules:/app/packages/api/node_modules
      - pc_node_modules:/app/packages/client/node_modules
    environment:
      - NODE_OPTIONS=--max-old-space-size=4096
    command: >
      sh -c "
        if [ ! -f node_modules/.package-lock.json ] || ! diff -q package-lock.json node_modules/.package-lock.json > /dev/null 2>&1; then
          echo '==> Installing dependencies...' &&
          npm ci --no-audit &&
          echo '==> Building all packages including frontend...' &&
          npx turbo run build --no-daemon;
        else
          echo '==> Dependencies up to date, checking build...' &&
          if [ ! -d client/dist ] || [ ! -f client/dist/index.html ]; then
            echo '==> Frontend not built, building...' &&
            npx turbo run build --no-daemon;
          else
            echo '==> All packages already built';
          fi
        fi
      "

  app:
    image: node:24.16.0-alpine
    working_dir: /app
    depends_on:
      mongodb:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    ports:
      - "3000:3080"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - client_node_modules:/app/client/node_modules
      - api_node_modules:/app/api/node_modules
      - dp_node_modules:/app/packages/data-provider/node_modules
      - ds_node_modules:/app/packages/data-schemas/node_modules
      - pa_node_modules:/app/packages/api/node_modules
      - pc_node_modules:/app/packages/client/node_modules
    environment:
      - HOST=0.0.0.0
      - PORT=3080
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_MASTER_KEY=DrhYf7zENyR6AlUCKmnz0eYASOQdl6zxH7s7MKFSfFCt
      - SEARCH=true
      - NO_INDEX=true
      - ALLOW_EMAIL_LOGIN=true
      - ALLOW_REGISTRATION=true
      - ALLOW_SOCIAL_LOGIN=false
      - ALLOW_SOCIAL_REGISTRATION=false
      - ALLOW_UNVERIFIED_EMAIL_LOGIN=true
      - SESSION_EXPIRY=1000 * 60 * 15
      - REFRESH_TOKEN_EXPIRY=(1000 * 60 * 60 * 24) * 7
      - JWT_SECRET=16f8c0ef4a5d391b26034086c628469d3f9f497f08163ab9b40137092f2909ef
      - JWT_REFRESH_SECRET=eaa5191f2914e30b9387fd84e254e4ba6fc51b4654968a9b0803b456a54b8418
      - CREDS_KEY=f34be427ebb29de8d88c107a71546019685ed8b241d8f2ed00c3df97ad2566f0
      - CREDS_IV=e2341419ec3dd3d19b13a1a87fafcbfb
      - DOMAIN_CLIENT=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - DOMAIN_SERVER=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - OPENAI_API_KEY=user_provided
      - ANTHROPIC_API_KEY=user_provided
      - GOOGLE_KEY=user_provided
      - DEBUG_LOGGING=true
      - NODE_ENV=production
    env_file:
      - /run/base44/app.env
    command: npx nodemon --ignore client/ --ignore packages/ api/server/index.js
    restart: unless-stopped

volumes:
  mongo_data:
  meili_data:
  node_modules:
  client_node_modules:
  api_node_modules:
  dp_node_modules:
  ds_node_modules:
  pa_node_modules:
  pc_node_modules:
